version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: amiguxus-db
    restart: always
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: amiguxus_dev
    ports:
      - "5433:5432"
    volumes:
      - amiguxus_postgres_data:/var/lib/postgresql/data
    networks:
      - amiguxus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d amiguxus_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amiguxus-redis
    restart: always
    command: redis-server --requirepass devpassword
    ports:
      - "6379:6379"
    volumes:
      - amiguxus_redis_data:/data
    networks:
      - amiguxus-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devpassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: amiguxus-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: amiguxusminio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - amiguxus_minio_data:/data
    networks:
      - amiguxus-net
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - amiguxus-net
    entrypoint: >
      /bin/sh -c "
      echo 'Aguardando MinIO ficar pronto...';
      sleep 5;
      /usr/bin/mc alias set local http://minio:9000 minioadmin amiguxusminio;
      /usr/bin/mc mb local/amiguxus-pets --ignore-existing;
      echo 'Definindo política de acesso pública...';
      /usr/bin/mc anonymous set public local/amiguxus-pets;
      echo 'Configuração do MinIO concluída.';
      exit 0;
      "

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: amiguxus-api
    restart: always
    environment:
      # App Config
      PORT: 3333
      HOST: 0.0.0.0
      NODE_ENV: development

      # Database - IMPORTANTE: usar o hostname interno 'postgres'
      DATABASE_URL: postgresql://devuser:devpassword@postgres:5432/amiguxus_dev?schema=public

      # Redis - usando o hostname interno 'redis'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: devpassword

      # MinIO - usando o hostname interno 'minio'
      MINIO_ENDPOINT: http://minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: amiguxusminio
      MINIO_BUCKET_NAME: amiguxus-pets

      # JWT e Cookies
      JWT_SECRET: d07e4ee2ba9f5d603192feb48d2278c2eb500538e7233883a6dcedf6789ded0d
      COOKIE_SECRET: d07e4ee2ba9f5d603192feb48d2278c2eb500538e7233883a6dcedf6789ded0d
      API_BASE_URL: http://localhost:3333

      # tsconfig-paths
      TS_NODE_PROJECT: tsconfig.paths.json
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - amiguxus-net

volumes:
  amiguxus_postgres_data:
    driver: local
  amiguxus_redis_data:
    driver: local
  amiguxus_minio_data:
    driver: local

networks:
  amiguxus-net:
    driver: bridge
