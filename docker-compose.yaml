# docker-compose.yml - Versão Definitiva

services:
  postgres:
    image: postgres:16-alpine
    container_name: amiguxus-db
    restart: always
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: amiguxus_dev
    ports:
      - "5433:5432"
    volumes:
      - amiguxus_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: amiguxus-redis
    restart: always
    command: redis-server --requirepass devpassword
    ports:
      - "6379:6379"
    volumes:
      - amiguxus_redis_data:/data

volumes:
  amiguxus_postgres_data:
    driver: local
  amiguxus_redis_data:
    driver: local
